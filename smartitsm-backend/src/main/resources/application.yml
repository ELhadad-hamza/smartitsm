spring:
  application:
    name: smartitsm-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/smartitsm
    username: ${DB_USER:smartitsm}
    password: ${DB_PASSWORD:smartitsm}
  jpa:
    hibernate:
      ddl-auto: validate      # c'est Flyway qui crée les tables, pas Hibernate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1vaS1zbWFydGl0c20tY2xlLXNlY3JldGUtZGV2LTI1Ni1iaXRzIQ==}
    expiration-ms: 86400000   # 24 h